# =============================================================================
# Logstash Pipeline — HIE Cross-Cloud Log Normalization
# Input: AWS CloudWatch, Azure Monitor, Wazuh Beats, Syslog
# Output: OpenSearch (normalized to ECS format)
# =============================================================================
#
# All logs normalized to Elastic Common Schema (ECS) 8.x regardless of source.
# This enables unified detection rules across AWS + Azure without source-specific
# logic in Wazuh rules.

# =============================================================================
# INPUT
# =============================================================================
input {

  # Wazuh Filebeat agents (AWS + Azure endpoints)
  beats {
    port            => 5044
    ssl_enabled     => true
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key         => "/etc/logstash/certs/logstash.key"
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    ssl_client_authentication => "required"
    tags            => ["beats_input"]
  }

  # Syslog — legacy HIE systems, network appliances
  syslog {
    port  => 5514
    type  => "syslog"
    tags  => ["syslog_input"]
  }

  # AWS CloudWatch Logs — VPC Flow, CloudTrail
  cloudwatch_logs {
    log_group        => ["/aws/vpc/hie-siem-flow-logs", "aws-cloudtrail-logs"]
    region           => "ca-central-1"
    interval         => 60
    start_position   => "end"
    type             => "aws_cloudwatch"
    tags             => ["aws", "cloudwatch"]
    # IAM role auth — no credentials in config
    use_aws_bundled_ca => true
  }

  # Azure Event Hub — Monitor diagnostic logs, NSG flow logs
  azure_event_hubs {
    event_hub_connections => ["${AZURE_EVENT_HUB_CONNECTION_STRING}"]
    threads               => 4
    decorate_events       => true
    consumer_group        => "hie-siem-logstash"
    storage_connection    => "${AZURE_STORAGE_CONNECTION_STRING}"
    storage_container     => "logstash-azure-offsets"
    type                  => "azure_event_hub"
    tags                  => ["azure", "event_hub"]
  }
}

# =============================================================================
# FILTER — Normalize all sources to ECS
# =============================================================================
filter {

  # --------------------------------------------------------------------------
  # AWS VPC Flow Log Normalization
  # --------------------------------------------------------------------------
  if "aws" in [tags] and [type] == "aws_cloudwatch" {
    grok {
      match => {
        "message" => "%{NUMBER:version} %{DATA:account_id} %{DATA:interface_id} %{IP:source_ip} %{IP:dest_ip} %{NUMBER:source_port:int} %{NUMBER:dest_port:int} %{NUMBER:protocol} %{NUMBER:packets:int} %{NUMBER:bytes:int} %{NUMBER:start_time} %{NUMBER:end_time} %{WORD:action} %{WORD:log_status}"
      }
      tag_on_failure => ["_vpc_flow_parse_failure"]
    }

    if "_vpc_flow_parse_failure" not in [tags] {
      # ECS normalization
      mutate {
        rename => {
          "source_ip"   => "[source][ip]"
          "dest_ip"     => "[destination][ip]"
          "source_port" => "[source][port]"
          "dest_port"   => "[destination][port]"
          "bytes"       => "[network][bytes]"
          "packets"     => "[network][packets]"
          "action"      => "[event][action]"
        }
        add_field => {
          "[cloud][provider]"  => "aws"
          "[cloud][region]"    => "ca-central-1"
          "[event][category]"  => "network"
          "[event][type]"      => "connection"
          "[event][dataset]"   => "aws.vpcflow"
          "[data_stream][type]" => "logs"
        }
      }

      # Protocol number to name
      translate {
        source      => "protocol"
        target      => "[network][transport]"
        dictionary  => { "6" => "tcp" "17" => "udp" "1" => "icmp" }
        fallback    => "unknown"
      }

      # Mark denied connections for anomaly detection
      if [event][action] == "REJECT" {
        mutate { add_tag => ["denied_flow"] }
      }
    }
  }

  # --------------------------------------------------------------------------
  # Azure NSG Flow Log Normalization
  # --------------------------------------------------------------------------
  if "azure" in [tags] {
    json { source => "message" target => "azure_raw" }

    if [azure_raw][category] == "NetworkSecurityGroupFlowEvent" {
      mutate {
        rename => {
          "[azure_raw][properties][flows][0][flows][0][flowTuples][0]" => "flow_tuple"
        }
      }

      # Azure NSG flow tuple: timestamp,srcIP,destIP,srcPort,destPort,protocol,direction,action,flowState,packetsStoD,bytesStoD,packetsDtoS,bytesDtoS
      csv {
        source    => "flow_tuple"
        separator => ","
        columns   => ["ts", "[source][ip]", "[destination][ip]", "[source][port]",
                     "[destination][port]", "[network][transport]", "direction",
                     "flow_action", "flow_state", "packets_s2d", "bytes_s2d",
                     "packets_d2s", "bytes_d2s"]
      }

      mutate {
        add_field => {
          "[cloud][provider]"  => "azure"
          "[cloud][region]"    => "canadacentral"
          "[event][category]"  => "network"
          "[event][type]"      => "connection"
          "[event][dataset]"   => "azure.nsgflow"
        }
      }

      # Normalize Azure allow/deny to ECS event.action
      if [flow_action] == "A" {
        mutate { add_field => { "[event][action]" => "allow" } }
      } else {
        mutate { add_field => { "[event][action]" => "deny" }
        add_tag  => ["denied_flow"] }
      }
    }

    # Azure Activity Log normalization
    if [azure_raw][category] == "Administrative" {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][dataset]"  => "azure.activitylogs"
          "[cloud][provider]" => "azure"
          "[cloud][region]"   => "canadacentral"
        }
        rename => {
          "[azure_raw][caller]"               => "[user][name]"
          "[azure_raw][callerIpAddress]"      => "[source][ip]"
          "[azure_raw][operationName][value]" => "[event][action]"
          "[azure_raw][status][value]"        => "[event][outcome]"
        }
      }
    }
  }

  # --------------------------------------------------------------------------
  # PHI / ePHI content detection — flag for HIPAA audit trail
  # --------------------------------------------------------------------------
  if [message] =~ /(?i)(patient|ePHI|PHI|health_record|MRN|DOB|SSN|diagnosis|prescription)/ {
    mutate {
      add_tag   => ["phi_related"]
      add_field => {
        "[labels][phi_adjacent]"  => "true"
        "[labels][compliance]"    => "HIPAA-PHIPA"
        "[event][severity]"       => "high"
      }
    }
  }

  # --------------------------------------------------------------------------
  # GeoIP enrichment — Canadian data residency monitoring
  # --------------------------------------------------------------------------
  if [source][ip] {
    geoip {
      source  => "[source][ip]"
      target  => "[source][geo]"
      fields  => ["country_code2", "country_name", "city_name", "region_name", "location"]
    }

    # Flag non-Canadian source IPs on PHI systems
    if [source][geo][country_code2] != "CA" and "phi_related" in [tags] {
      mutate {
        add_tag   => ["foreign_phi_access"]
        add_field => { "[labels][cross_border_risk]" => "true" }
      }
    }
  }

  # --------------------------------------------------------------------------
  # Timestamp normalization — all logs to UTC
  # --------------------------------------------------------------------------
  date {
    match    => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"]
    target   => "@timestamp"
    timezone => "UTC"
  }

  # Strip raw fields after normalization
  mutate {
    remove_field => ["azure_raw", "message_raw", "host", "flow_tuple"]
  }
}

# =============================================================================
# OUTPUT — OpenSearch + alert forwarding
# =============================================================================
output {

  # Primary output — OpenSearch (Wazuh indexer)
  opensearch {
    hosts               => ["https://opensearch-node1:9200"]
    user                => "${OPENSEARCH_USER}"
    password            => "${OPENSEARCH_PASSWORD}"
    ssl                 => true
    cacert              => "/etc/logstash/certs/ca.crt"
    index               => "hie-siem-logs-%{[cloud][provider]}-%{+YYYY.MM.dd}"
    template_name       => "hie-siem-logs"
    template_overwrite  => false
    ilm_enabled         => true
    ilm_rollover_alias  => "hie-siem-logs"
    ilm_policy          => "hie-siem-7year-retention"
  }

  # Denied flows → separate high-priority index
  if "denied_flow" in [tags] {
    opensearch {
      hosts             => ["https://opensearch-node1:9200"]
      user              => "${OPENSEARCH_USER}"
      password          => "${OPENSEARCH_PASSWORD}"
      ssl               => true
      cacert            => "/etc/logstash/certs/ca.crt"
      index             => "hie-siem-denied-flows-%{+YYYY.MM.dd}"
    }
  }

  # PHI-adjacent events → compliance audit index
  if "phi_related" in [tags] {
    opensearch {
      hosts             => ["https://opensearch-node1:9200"]
      user              => "${OPENSEARCH_USER}"
      password          => "${OPENSEARCH_PASSWORD}"
      ssl               => true
      cacert            => "/etc/logstash/certs/ca.crt"
      index             => "hie-siem-phi-audit-%{+YYYY.MM.dd}"
    }
  }

  # Cross-border PHI access → immediate webhook alert
  if "foreign_phi_access" in [tags] {
    http {
      url     => "${ALERT_WEBHOOK_URL}"
      format  => "json"
      method  => "post"
      headers => { "Content-Type" => "application/json" "X-HIE-Alert" => "CROSS-BORDER-PHI" }
    }
  }
}
