<!--
  Wazuh Worker Node Configuration — HIE SIEM
  Receives delegated analysis tasks from the manager.
  Handles Azure-sourced Wazuh agent events (VMs + AKS).
-->
<ossec_config>
  <cluster>
    <name>hie-siem-cluster</name>
    <node_name>wazuh-worker</node_name>
    <node_type>worker</node_type>
    <key>${WAZUH_CLUSTER_KEY}</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
  </global>
</ossec_config>
