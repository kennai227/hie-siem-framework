<!--
  Wazuh Manager Configuration — HIE SIEM
  HIPAA 164.312(b) Audit Controls
  PHIPA S.12(1)(b) Accountability
-->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>yes</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>hie-siem-wazuh@yourdomain.ca</email_from>
    <email_to>soc@yourdomain.ca</email_to>
    <email_maxperhour>50</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <!-- Alert level 12+ triggers email (HIPAA-critical events) -->
    <email_alert_level>12</email_alert_level>
  </global>

  <!-- =========================================================
       CLUSTER — Manager + Worker distributed analysis
  ========================================================== -->
  <cluster>
    <name>hie-siem-cluster</name>
    <node_name>wazuh-manager</node_name>
    <node_type>master</node_type>
    <key>${WAZUH_CLUSTER_KEY}</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-worker</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

  <!-- =========================================================
       ALERTS — Minimum level for logging and email
  ========================================================== -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- =========================================================
       FILE INTEGRITY MONITORING — HIPAA 164.312(c)(1)
       Monitor ePHI directories and critical system files
  ========================================================== -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Real-time FIM on ePHI directories -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/lib/ehr</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/opt/epic</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/data/phi</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/mnt/patient</directories>

    <!-- System integrity -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin,/boot</directories>

    <!-- Ignore transient files -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <alert_new_files>yes</alert_new_files>
    <remove_old_diff>yes</remove_old_diff>
    <max_files_per_second>100</max_files_per_second>
  </syscheck>

  <!-- =========================================================
       ROOTKIT DETECTION
  ========================================================== -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <system_audit>etc/shared/system_audit_rcl.txt</system_audit>
    <system_audit>etc/shared/system_audit_ssh.txt</system_audit>
    <system_audit>etc/shared/cis_debian_linux_rcl.txt</system_audit>
  </rootcheck>

  <!-- =========================================================
       VULNERABILITY DETECTION — PHIPA risk assessment support
  ========================================================== -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- =========================================================
       LOG ANALYSIS — Collect logs from AWS + Azure + local
  ========================================================== -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- AWS CloudTrail via S3 -->
  <wodle name="aws-s3">
    <disabled>no</disabled>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>
    <bucket type="cloudtrail">
      <name>hie-siem-log-archive-ACCOUNT_ID</name>
      <path>cloudtrail/</path>
      <aws_region>ca-central-1</aws_region>
      <!-- Use IAM role, not keys -->
    </bucket>
    <bucket type="vpcflow">
      <name>hie-siem-log-archive-ACCOUNT_ID</name>
      <path>vpcflow/</path>
      <aws_region>ca-central-1</aws_region>
    </bucket>
    <bucket type="guardduty">
      <name>hie-siem-log-archive-ACCOUNT_ID</name>
      <path>guardduty/</path>
      <aws_region>ca-central-1</aws_region>
    </bucket>
  </wodle>

  <!-- AWS Security Hub findings -->
  <wodle name="aws-s3">
    <disabled>no</disabled>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>
    <service type="securityhub">
      <aws_region>ca-central-1</aws_region>
    </service>
  </wodle>

  <!-- =========================================================
       ACTIVE RESPONSE — Automated containment
  ========================================================== -->
  <active-response>
    <!-- Block IPs that trigger brute force rules -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100002</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <active-response>
    <!-- Isolate host on ransomware detection -->
    <command>host-deny</command>
    <location>local</location>
    <rules_id>100050,100051</rules_id>
    <timeout>0</timeout> <!-- No auto-restore for ransomware -->
  </active-response>

  <!-- =========================================================
       INDEXER — OpenSearch connection
  ========================================================== -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://opensearch-node1:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

</ossec_config>
